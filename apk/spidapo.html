<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batas Waktu Habis</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Background gradien full color yang dinamis */
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #f6d365, #fda085);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      overflow: hidden;
    }

    /* Animasi background bergerak */
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Style kotak kaca (Glassmorphism) */
    .glass-card {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 50px 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
      max-width: 450px;
      width: 85%;
      margin: 20px;
    }

    /* Animasi ikon melayang */
    .icon {
      font-size: 80px;
      margin-bottom: 10px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }

    h1 {
      font-size: 32px;
      margin: 0 0 10px 0;
      color: #1f2937;
      font-weight: 700;
    }

    .message {
      font-size: 20px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .sub-message {
      font-size: 15px;
      color: #4b5563;
      font-weight: 400;
      line-height: 1.6;
    }

    /* Elemen dekorasi lingkaran di belakang */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      z-index: -1;
      filter: blur(5px);
    }
    .circle-1 {
      width: 200px;
      height: 200px;
      top: -50px;
      left: -50px;
    }
    .circle-2 {
      width: 300px;
      height: 300px;
      bottom: -80px;
      right: -80px;
    }
  </style>
</head>
<body>

  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>

  <div class="glass-card">
    <div class="icon">⏳</div>
    <h1>Maaf.</h1>
    <div class="message">
      Pengisian Data Telah Melewati Batas Waktu.
    </div>
    <div class="sub-message">
      Terima Kasih atas Partisipasi Anda.
    </div>
  </div>

</body>
</html>

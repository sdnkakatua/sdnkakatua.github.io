<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brankas Kode VBA Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-code { font-family: 'Fira Code', monospace; }
        
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .modal-enter { opacity: 1; transform: scale(1); pointer-events: auto; }
        .modal-leave { opacity: 0; transform: scale(0.95); pointer-events: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col pb-12">

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm backdrop-blur-md bg-white/90">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-indigo-200 shadow-lg">
                    <i class="ph-bold ph-code text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-800 leading-tight">VBA Code - Vault</h1>
                    <p class="text-xs font-semibold text-slate-500">Cloud Based Vault | VBA & Macro</p>
                </div>
            </div>
            <button onclick="openAddModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-xl shadow-lg shadow-indigo-100 transition duration-200 text-sm cursor-pointer">
                <i class="ph-bold ph-plus text-base"></i>
                <span class="hidden sm:inline">Add Code</span>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto px-6 py-10 w-full">
        <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight">Script Collection <i class="ph-duotone ph-sparkle text-amber-400"></i></h2>
                <p class="text-slate-500 mt-1 text-sm sm:text-base">Real-time data sync to Google Sheets.</p>
            </div>
            <div id="connection-status" class="self-start md:self-center px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 bg-amber-50 text-amber-600 border border-amber-200">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Connecting to Cloud...
            </div>
        </div>

        <div class="mb-6">
            <div class="relative max-w-md">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                    <i class="ph-bold ph-magnifying-glass text-lg"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="Find the code name/desc..." class="w-full bg-white border border-slate-200 rounded-xl pl-11 pr-4 py-2.5 text-sm font-semibold shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            </div>
        </div>

        <div id="code-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <div id="detail-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm modal-leave transition-all duration-300 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl flex flex-col overflow-hidden transform transition-all duration-300 max-h-[90vh]">
            <div class="flex justify-between items-start px-6 py-5 border-b border-slate-100 bg-white">
                <div class="flex-1 mr-4">
                    <div id="view-header" class="block">
                        <h3 id="modal-title" class="text-xl font-bold text-slate-800">Code Name</h3>
                        <p id="modal-desc" class="text-sm text-slate-500 mt-1">Description.</p>
                    </div>
                    <div id="edit-header" class="hidden space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Code Name</label>
                            <input type="text" id="edit-input-title" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm font-semibold focus:outline-none focus:border-indigo-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Description</label>
                            <textarea id="edit-input-desc" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-sm font-semibold focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
                        </div>
                    </div>
                </div>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-2 rounded-full transition cursor-pointer">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>

            <div class="flex-1 flex flex-col md:flex-row bg-slate-900 overflow-hidden relative">
                <div class="flex-1 h-64 md:h-auto overflow-auto p-6 custom-scrollbar text-sm font-code">
                    <pre id="view-code-container"><code id="modal-code" class="text-slate-300 whitespace-pre leading-relaxed"></code></pre>
                    <textarea id="edit-input-code" class="w-full h-full bg-transparent text-slate-300 font-code focus:outline-none border-0 p-0 m-0 resize-none leading-relaxed hidden" spellcheck="false"></textarea>
                </div>

                <div class="bg-slate-800 md:w-48 border-t md:border-t-0 md:border-l border-slate-700 p-4 flex md:flex-col gap-3 justify-end md:justify-start z-10">
                    <div id="view-actions" class="w-full flex md:flex-col gap-3">
                        <button id="copy-btn" onclick="copyCurrentCode()" class="w-full flex items-center justify-center md:justify-start gap-2 bg-slate-700 hover:bg-indigo-600 text-white px-3 py-2.5 rounded-xl text-xs font-bold transition shadow-md cursor-pointer">
                            <i id="copy-icon" class="ph-bold ph-copy text-base"></i>
                            <span id="copy-text">copy</span>
                        </button>
                        <button onclick="toggleEditState(true)" class="w-full flex items-center justify-center md:justify-start gap-2 bg-slate-700 hover:bg-amber-500 text-white px-3 py-2.5 rounded-xl text-xs font-bold transition shadow-md cursor-pointer">
                            <i class="ph-bold ph-pencil text-base"></i>
                            <span>Edit</span>
                        </button>
                        <button onclick="confirmDelete()" class="w-full flex items-center justify-center md:justify-start gap-2 bg-slate-700 hover:bg-rose-600 text-white px-3 py-2.5 rounded-xl text-xs font-bold transition shadow-md cursor-pointer md:mt-auto">
                            <i class="ph-bold ph-trash text-base"></i>
                            <span>Delete</span>
                        </button>
                    </div>

                    <div id="edit-actions" class="w-full flex md:flex-col gap-3 hidden">
                        <button id="save-edit-btn" onclick="saveEdit()" class="w-full flex items-center justify-center md:justify-start gap-2 bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2.5 rounded-xl text-xs font-bold transition shadow-md cursor-pointer disabled:opacity-50">
                            <i class="ph-bold ph-floppy-disk text-base"></i>
                            <span id="save-edit-text">Save</span>
                        </button>
                        <button id="cancel-edit-btn" onclick="toggleEditState(false)" class="w-full flex items-center justify-center md:justify-start gap-2 bg-slate-600 hover:bg-slate-500 text-white px-3 py-2.5 rounded-xl text-xs font-bold transition shadow-md cursor-pointer">
                            <i class="ph-bold ph-x-circle text-base"></i>
                            <span>Cancel</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="add-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm modal-leave transition-all duration-300 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col overflow-hidden transform transition-all duration-300">
            <div class="flex justify-between items-center px-6 py-4 border-b border-slate-100 bg-white">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-100 text-indigo-600 p-1.5 rounded-lg"><i class="ph-bold ph-plus-circle text-xl"></i></div>
                    <h3 class="text-lg font-bold text-slate-800">Add Code</h3>
                </div>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-2 rounded-full transition cursor-pointer"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto custom-scrollbar">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-1.5">VBA / Makro Name</label>
                    <input type="text" id="add-title" placeholder="Contoh: Auto Fit Kolom Otomatis" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition font-semibold bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-1.5">Function Description</label>
                    <textarea id="add-desc" rows="2" placeholder="Gunakan untuk merapikan semua kolom sheet dalam satu kali klik..." class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition font-semibold bg-slate-50 resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-1.5">Write / Paste Code</label>
                    <textarea id="add-code" rows="8" placeholder="Sub Macroku()..." class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition font-code text-slate-700 bg-slate-50 leading-relaxed" spellcheck="false"></textarea>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                <button onclick="closeAddModal()" class="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-bold transition cursor-pointer">Cancel</button>
                <button id="submit-new-btn" onclick="submitNewCode()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold transition shadow-md cursor-pointer">Save to Cloud</button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm modal-leave transition-all duration-300 hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 transform transition-all duration-300 text-center">
            <div class="w-14 h-14 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-4 border border-rose-100 shadow-sm">
                <i class="ph-bold ph-warning-octagon"></i>
            </div>
            <h4 class="text-lg font-bold text-slate-800">Remove Script?</h4>
            <p class="text-sm text-slate-500 mt-2">This action will delete the script permanantly.</p>
            <div class="mt-6 flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition cursor-pointer">Calcel</button>
                <button id="execute-delete-btn" onclick="executeDelete()" class="flex-1 py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl text-sm transition shadow-md cursor-pointer">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script>
        // URL Apps Script Anda
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5y92H1kWgGdPBRbNxhdZD3odNM9EPKp7FoQxEJI8Ejby52FzsvduiaTFZey57nIIlDw/exec"; 

        // Data Mock cadangan jika offline
        const mockDatabase = [
            { id: "MOCK-1", title: "Auto Fit Semua Kolom", desc: "Menyesuaikan lebar kolom otomatis di seluruh Worksheet secara instan.", code: "Sub AutoFitAllColumns()\n    Dim ws As Worksheet\n    For Each ws In ThisWorkbook.Worksheets\n        ws.Cells.EntireColumn.AutoFit\n    Next ws\nEnd Sub" },
            { id: "MOCK-2", title: "Export Sheet ke PDF", desc: "Menyimpan worksheet aktif menjadi file format PDF di folder lokal.", code: "Sub ExportToPDF()\n    ActiveSheet.ExportAsFixedFormat Type:=xlTypePDF, Filename:=ThisWorkbook.Path & \"\\\" & ActiveSheet.Name & \".pdf\"\nEnd Sub" }
        ];

        let databaseKode = [];
        let activeItem = null;

        // Toast System
        function toast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toastEl = document.createElement('div');
            let bgClass = "bg-white border-l-4 border-emerald-500 shadow-xl";
            let iconEl = `<i class="ph-bold ph-check-circle text-emerald-500 text-xl"></i>`;
            
            if (type === 'error') {
                bgClass = "bg-white border-l-4 border-rose-500 shadow-xl";
                iconEl = `<i class="ph-bold ph-x-circle text-rose-500 text-xl"></i>`;
            } else if (type === 'info') {
                bgClass = "bg-white border-l-4 border-indigo-500 shadow-xl";
                iconEl = `<i class="ph-bold ph-info text-indigo-500 text-xl"></i>`;
            }

            toastEl.className = `${bgClass} flex items-center gap-3 px-4 py-3.5 rounded-xl max-w-sm pointer-events-auto transition-all duration-300 opacity-0 transform translate-y-2`;
            toastEl.innerHTML = `${iconEl}<p class="text-xs sm:text-sm font-bold text-slate-700">${message}</p>`;
            
            container.appendChild(toastEl);
            setTimeout(() => { toastEl.classList.remove('opacity-0', 'translate-y-2'); }, 50);
            setTimeout(() => {
                toastEl.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toastEl.remove(), 300);
            }, 3500);
        }

        // Fetch & Network
        async function fetchAllData() {
            const statusIndicator = document.getElementById('connection-status');
            renderShimmer();
            
            if (!WEB_APP_URL) {
                statusIndicator.className = "px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 bg-amber-50 text-amber-700 border border-amber-200";
                statusIndicator.innerHTML = `<i class="ph-bold ph-database text-sm"></i> Mode Lokal (Offline)`;
                databaseKode = JSON.parse(localStorage.getItem('vba_vault_local')) || mockDatabase;
                renderCards(databaseKode);
                return;
            }

            try {
                const response = await fetch(WEB_APP_URL);
                databaseKode = await response.json();
                statusIndicator.className = "px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 bg-emerald-50 text-emerald-600 border border-emerald-200";
                statusIndicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Connected to Spreadsheet`;
                renderCards(databaseKode);
            } catch (err) {
                statusIndicator.className = "px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 bg-rose-50 text-rose-600 border border-rose-200";
                statusIndicator.innerHTML = `<i class="ph-bold ph-plugs-crossed text-sm"></i> Putus dari Cloud`;
                databaseKode = JSON.parse(localStorage.getItem('vba_vault_local')) || mockDatabase;
                renderCards(databaseKode);
            }
        }

        async function sendCloudRequest(payload) {
            if (!WEB_APP_URL) {
                if (payload.action === 'add') {
                    databaseKode.push({ id: "LOCAL-" + new Date().getTime(), title: payload.title, desc: payload.desc, code: payload.code });
                } else if (payload.action === 'edit') {
                    const idx = databaseKode.findIndex(item => item.id === payload.id);
                    if (idx !== -1) databaseKode[idx] = payload;
                } else if (payload.action === 'delete') {
                    databaseKode = databaseKode.filter(item => item.id !== payload.id);
                }
                localStorage.setItem('vba_vault_local', JSON.stringify(databaseKode));
                return { status: "success" };
            }
            try {
                await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload) });
                return { status: "success" };
            } catch (error) {
                return { status: "error" };
            }
        }

        // Render UI
        function renderShimmer() {
            document.getElementById('code-grid').innerHTML = Array(4).fill(0).map(() => `
                <div class="bg-white border border-slate-100 rounded-2xl p-5 space-y-4 animate-pulse">
                    <div class="w-12 h-12 bg-slate-200 rounded-xl"></div>
                    <div class="h-5 bg-slate-200 rounded w-2/3"></div>
                    <div class="h-3 bg-slate-200 rounded"></div>
                </div>
            `).join('');
        }

        function renderCards(data) {
            const grid = document.getElementById('code-grid');
            grid.innerHTML = '';
            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-bold">Script tidak ditemukan</div>`;
                return;
            }
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-2xl p-5 hover:shadow-xl hover:border-indigo-300 hover:-translate-y-1 transition-all duration-300 cursor-pointer group flex flex-col h-full";
                card.onclick = () => openDetailModal(item);
                card.innerHTML = `
                    <div class="bg-indigo-50 w-11 h-11 rounded-xl flex items-center justify-center text-indigo-500 mb-4 group-hover:bg-indigo-600 group-hover:text-white transition-colors duration-300">
                        <i class="ph-bold ph-terminal-window text-xl"></i>
                    </div>
                    <h3 class="text-base font-bold text-slate-800 mb-1.5 group-hover:text-indigo-600 line-clamp-1">${item.title}</h3>
                    <p class="text-xs sm:text-sm text-slate-500 flex-1 line-clamp-2">${item.desc || 'Tidak ada deskripsi.'}</p>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center text-xs font-bold text-indigo-500 uppercase">
                        Open Script <i class="ph-bold ph-arrow-right ml-1 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            renderCards(databaseKode.filter(item => item.title.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query)));
        }

        // Modals Controller Animation
        function showModalAnim(id) {
            const el = document.getElementById(id); el.classList.remove('hidden');
            setTimeout(() => { el.classList.remove('modal-leave'); el.classList.add('modal-enter'); }, 20);
        }
        function hideModalAnim(id) {
            const el = document.getElementById(id); el.classList.remove('modal-enter'); el.classList.add('modal-leave');
            setTimeout(() => el.classList.add('hidden'), 250);
        }

        // Add Script
        function openAddModal() {
            document.getElementById('add-title').value = ''; document.getElementById('add-desc').value = ''; document.getElementById('add-code').value = '';
            showModalAnim('add-modal');
        }
        function closeAddModal() { hideModalAnim('add-modal'); }
        async function submitNewCode() {
            const title = document.getElementById('add-title').value.trim();
            const desc = document.getElementById('add-desc').value.trim();
            const code = document.getElementById('add-code').value.trim();
            if (!title || !code) { toast("Judul dan isi Script wajib diisi!", "error"); return; }
            
            toast("Menyimpan script...", "info");
            const res = await sendCloudRequest({ action: 'add', title, desc, code });
            closeAddModal();
            if(res.status === "success") { toast("Script berhasil disimpan!"); fetchAllData(); }
        }

        // Detail & Core Toggle Logic
        function openDetailModal(item) {
            activeItem = item;
            toggleEditState(false); // Memastikan selalu masuk ke View Mode (Simpan/Batal tersembunyi)
            
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-desc').innerText = item.desc || "Tidak ada deskripsi.";
            document.getElementById('modal-code').innerText = item.code;
            
            showModalAnim('detail-modal');
        }
        function closeDetailModal() { hideModalAnim('detail-modal'); activeItem = null; }

        // Fungsi Inti Penentu Tampilan Tombol
        function toggleEditState(isEditing) {
            const viewHeader = document.getElementById('view-header');
            const editHeader = document.getElementById('edit-header');
            const viewCode = document.getElementById('view-code-container');
            const editCode = document.getElementById('edit-input-code');
            
            const viewActions = document.getElementById('view-actions'); // Wadah tombol Salin, Edit, Hapus
            const editActions = document.getElementById('edit-actions'); // Wadah tombol Simpan, Batal

            if (isEditing) {
                // Isi nilai input form edit sesuai data saat ini
                document.getElementById('edit-input-title').value = activeItem.title;
                document.getElementById('edit-input-desc').value = activeItem.desc;
                document.getElementById('edit-input-code').value = activeItem.code;

                // Tampilkan Form Edit, Sembunyikan Tampilan Standar
                viewHeader.classList.add('hidden'); editHeader.classList.remove('hidden');
                viewCode.classList.add('hidden'); editCode.classList.remove('hidden');
                
                // SEMBUNYIKAN Salin/Edit/Hapus, TAMPILKAN Simpan & Batal
                viewActions.classList.add('hidden'); 
                editActions.classList.remove('hidden');
            } else {
                // Kembalikan ke Tampilan Standar Mengunci Kode
                viewHeader.classList.remove('hidden'); editHeader.classList.add('hidden');
                viewCode.classList.remove('hidden'); editCode.classList.add('hidden');
                
                // TAMPILKAN Kembali Salin/Edit/Hapus, SEMBUNYIKAN Simpan & Batal
                viewActions.classList.remove('hidden'); 
                editActions.classList.add('hidden');
                resetCopyBtnUi();
            }
        }

        async function saveEdit() {
            const uTitle = document.getElementById('edit-input-title').value.trim();
            const uDesc = document.getElementById('edit-input-desc').value.trim();
            const uCode = document.getElementById('edit-input-code').value.trim();
            if (!uTitle || !uCode) { toast("Judul dan isi script tidak boleh kosong!", "error"); return; }

            document.getElementById('save-edit-text').innerText = "Memperbarui...";
            const res = await sendCloudRequest({ action: 'edit', id: activeItem.id, title: uTitle, desc: uDesc, code: uCode });
            document.getElementById('save-edit-text').innerText = "Save";
            
            closeDetailModal();
            if(res.status === "success") { toast("Perubahan berhasil disimpan!"); fetchAllData(); }
        }

        // Delete Logic
        function confirmDelete() { showModalAnim('confirm-modal'); }
        function closeConfirmModal() { hideModalAnim('confirm-modal'); }
        async function executeDelete() {
            closeConfirmModal(); closeDetailModal();
            toast("Menghapus data...", "info");
            const res = await sendCloudRequest({ action: 'delete', id: activeItem.id });
            if(res.status === "success") { toast("Script berhasil terhapus.", "error"); fetchAllData(); }
        }

        // Clipboard Copy
        function copyCurrentCode() {
            if (!activeItem) return;
            navigator.clipboard.writeText(activeItem.code).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.className = "w-full flex items-center justify-center md:justify-start gap-2 bg-emerald-500 text-white px-3 py-2.5 rounded-xl text-xs font-bold transition shadow-md cursor-pointer";
                document.getElementById('copy-icon').className = "ph-bold ph-check text-base";
                document.getElementById('copy-text').innerText = "Copied!";
                toast("Kode disalin ke papan klip!");
                setTimeout(resetCopyBtnUi, 2000);
            });
        }

        function resetCopyBtnUi() {
            const btn = document.getElementById('copy-btn');
            if(btn) {
                btn.className = "w-full flex items-center justify-center md:justify-start gap-2 bg-slate-700 hover:bg-indigo-600 text-white px-3 py-2.5 rounded-xl text-xs font-bold transition shadow-md cursor-pointer";
                document.getElementById('copy-icon').className = "ph-bold ph-copy text-base";
                document.getElementById('copy-text').innerText = "Copy";
            }
        }

        // Close on Overlay Backdrop Click
        document.querySelectorAll('.fixed').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    if(this.id === 'detail-modal') closeDetailModal();
                    if(this.id === 'add-modal') closeAddModal();
                    if(this.id === 'confirm-modal') closeConfirmModal();
                }
            });
        });

        window.onload = fetchAllData;
    </script>
</body>
</html>

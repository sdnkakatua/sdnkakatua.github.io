<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Data Siswa | sdnkakatua</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; }
        
        /* Animasi Shake */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
            border-color: #ef4444 !important;
            color: #ef4444 !important;
        }

        /* Style untuk dropdown SweetAlert */
        .swal2-html-container { overflow: visible !important; }
        .date-select {
            padding: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            color: #1e293b;
            font-size: 0.875rem;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .date-select:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .date-select option[value=""][disabled] { color: #94a3b8; }
        
        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">SD</div>
                <span class="font-bold text-lg tracking-tight text-slate-700">Data Siswa SDN Kakatua</span>
            </div>
            <div id="nav-action">
                <button id="btn-nav-back" onclick="showList()" class="hidden items-center bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs font-medium transition-colors border border-slate-200">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Kembali
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
        
        <div id="view-list" class="block">
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-slate-800 mb-2">Pemadanan Data Siswa</h1>
                <p class="text-slate-500 text-sm">Pilih nama siswa dan masukkan tanggal lahir untuk mengakses data.</p>
            </div>
            
            <div id="loading-list" class="flex justify-center items-center py-12">
                <div class="loader w-8 h-8"></div>
                <span class="ml-3 text-slate-500">Memuat data dari server...</span>
            </div>

            <div id="student-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 hidden">
                </div>
        </div>

        <div id="view-detail" class="hidden">
            <button onclick="showList()" class="mb-6 flex items-center text-blue-600 hover:text-blue-800 font-medium text-sm transition-colors">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Kembali ke Daftar
            </button>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                <div class="bg-slate-800 px-6 py-4">
                    <h2 class="text-white font-semibold">Biodata Utama Siswa</h2>
                </div>
                <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Nama Lengkap</label>
                        <p id="detail-nama" class="font-medium text-slate-800 text-lg">-</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Kelas</label>
                        <p id="detail-kelas" class="font-medium text-slate-800 text-lg">-</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">NISN</label>
                        <p id="detail-nisn" class="font-medium text-slate-800 text-lg">-</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Tanggal Lahir</label>
                        <p id="detail-dob" class="font-medium text-slate-800 text-lg">-</p>
                    </div>
                </div>
            </div>

            <h3 class="text-lg font-bold text-slate-800 mb-4">Dokumen Pendukung</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h4 class="font-semibold text-slate-700 mb-4">Kartu Keluarga (KK)</h4>
                    <div id="ui-kk" class="border-2 border-dashed border-slate-300 rounded-xl p-6 flex flex-col items-center justify-center text-center transition-colors hover:border-blue-400">
                        </div>
                    <input type="file" id="input-kk" class="hidden" accept="image/*,application/pdf" onchange="handleFileSelect(event, 'kk')">
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h4 class="font-semibold text-slate-700 mb-4">Akta Lahir</h4>
                    <div id="ui-akta" class="border-2 border-dashed border-slate-300 rounded-xl p-6 flex flex-col items-center justify-center text-center transition-colors hover:border-blue-400">
                        </div>
                    <input type="file" id="input-akta" class="hidden" accept="image/*,application/pdf" onchange="handleFileSelect(event, 'akta')">
                </div>

            </div>
        </div>

    </main>

    <script>
        // GANTI URL INI DENGAN URL DEPLOYMENT GOOGLE APPS SCRIPT ANDA
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwhI-hbsqW2U8UTkhJGf6MrPGxer81GNIoagv9WqQ-2yBeMy8uNiVQaO0xpJU8kRGJS/exec';
        
        let currentStudent = null;

        // ==========================================
        // MOCK DATA (Hapus jika SCRIPT_URL sudah aktif)
        // ==========================================
        const USE_MOCK = false; 
        const mockStudents = [
            { id: "S01", nama: "Ahmad Fauzi", kelas: "6A", nisn: "001234501", dob: "12/05/2014", kkUrl: "", aktaUrl: "" },
            { id: "S02", nama: "Bunga Citra", kelas: "6B", nisn: "001234502", dob: "25/08/2014", kkUrl: "", aktaUrl: "" },
            { id: "S03", nama: "Candra Wijaya", kelas: "6A", nisn: "001234503", dob: "01/01/2015", kkUrl: "", aktaUrl: "" }
        ];

        // ==========================================
        // INIT & FETCH LIST + HISTORY MANAGEMENT
        // ==========================================
        window.onload = () => {
            // PERUBAHAN: Daftarkan state awal (Halaman List) ke history browser
            history.replaceState({ view: 'list' }, '');
            fetchStudentList();
        };

        // PERUBAHAN: Event listener untuk mendeteksi tombol Back bawaan HP / Laptop
        window.onpopstate = function(event) {
            if (event.state && event.state.view === 'detail') {
                renderStudentDetailUI(event.state.data);
            } else {
                renderListUI();
            }
        };

        async function fetchStudentList() {
            if (USE_MOCK) {
                setTimeout(() => renderStudentList(mockStudents), 1000);
                return;
            }

            try {
                const response = await fetch(`${SCRIPT_URL}?action=getStudents`);
                const data = await response.json();
                renderStudentList(data);
            } catch (error) {
                Swal.fire('Error', 'Gagal memuat data dari server.', 'error');
            }
        }

        function renderStudentList(students) {
            document.getElementById('loading-list').classList.add('hidden');
            const grid = document.getElementById('student-grid');
            grid.classList.remove('hidden');
            grid.innerHTML = '';

            students.forEach(student => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm hover:shadow-md border border-black cursor-pointer transition-all hover:-translate-y-1 group flex items-center justify-between";
                card.onclick = () => promptPasscode(student);
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-slate-800 group-hover:text-blue-600 transition-colors">${student.nama}</h3>
                        <p class="text-xs text-slate-500 mt-1">Kelas ${student.kelas}</p>
                    </div>
                    <div class="bg-blue-50 p-2 rounded-full text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ==========================================
        // PASSCODE MODAL (SWEETALERT)
        // ==========================================
        function promptPasscode(student) {
            Swal.fire({
                title: 'Verifikasi Tanggal Lahir',
                html: `
                    <p class="text-sm text-slate-500 mb-4">Masukkan tanggal lahir untuk <b>${student.nama}</b></p>
                    <div id="swal-passcode-container" class="flex space-x-2 justify-center">
                        <select id="pass-day" class="date-select w-1/3 text-slate-400">
                            <option value="" disabled selected>Hari</option>
                        </select>
                        <select id="pass-month" class="date-select w-1/3 text-slate-400">
                            <option value="" disabled selected>Bulan</option>
                        </select>
                        <select id="pass-year" class="date-select w-1/3 text-slate-400">
                            <option value="" disabled selected>Tahun</option>
                        </select>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Buka Data',
                cancelButtonText: 'Batal',
                confirmButtonColor: '#3b82f6',
                customClass: { popup: 'rounded-3xl' },
                didOpen: () => {
                    populateDropdowns();
                    document.querySelectorAll('.date-select').forEach(sel => {
                        sel.addEventListener('change', function() {
                            this.classList.remove('text-slate-400');
                            this.classList.add('text-slate-800');
                        });
                    });
                },
                preConfirm: () => {
                    const day = document.getElementById('pass-day').value;
                    const month = document.getElementById('pass-month').value;
                    const year = document.getElementById('pass-year').value;
                    
                    if (!day || !month || !year) {
                        triggerShake();
                        return false; 
                    }

                    const inputDate = `${day.padStart(2, '0')}/${month.padStart(2, '0')}/${year}`;
                    
                    return new Promise((resolve) => {
                        if (USE_MOCK) {
                            if (inputDate === student.dob) resolve(student);
                            else { triggerShake(); resolve(false); }
                        } else {
                            fetch(SCRIPT_URL, {
                                method: 'POST',
                                body: JSON.stringify({ action: 'verify', id: student.id, dob: inputDate })
                            }).then(res => res.json()).then(res => {
                                if(res.success) resolve(res.data);
                                else { triggerShake(); resolve(false); }
                            });
                        }
                    });
                }
            }).then((result) => {
                if (result.isConfirmed && result.value) {
                    showStudentDetail(result.value);
                }
            });
        }

        function populateDropdowns() {
            const d = document.getElementById('pass-day');
            const m = document.getElementById('pass-month');
            const y = document.getElementById('pass-year');
            
            for(let i=1; i<=31; i++) d.innerHTML += `<option value="${i}">${i}</option>`;
            const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
            months.forEach((mo, i) => m.innerHTML += `<option value="${i+1}">${mo}</option>`);
            for(let i=2010; i<=2020; i++) y.innerHTML += `<option value="${i}">${i}</option>`;
        }

        function triggerShake() {
            const container = document.getElementById('swal-passcode-container');
            const selects = container.querySelectorAll('select');
            
            selects.forEach(s => {
                s.classList.remove('shake');
                void s.offsetWidth; 
                s.classList.add('shake');
            });
        }

        // ==========================================
        // PAGE TRANSITION & RENDER DETAIL
        // ==========================================
        // PERUBAHAN: Memisahkan pushState history dan rendering UI detail siswa
        function showStudentDetail(studentData) {
            history.pushState({ view: 'detail', data: studentData }, '');
            renderStudentDetailUI(studentData);
        }

        function renderStudentDetailUI(studentData) {
            currentStudent = studentData;
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-detail').classList.remove('hidden');

            // Tampilkan tombol back di header navbar
            const btnNavBack = document.getElementById('btn-nav-back');
            btnNavBack.classList.remove('hidden');
            btnNavBack.classList.add('flex');

            document.getElementById('detail-nama').innerText = studentData.nama;
            document.getElementById('detail-kelas').innerText = studentData.kelas;
            document.getElementById('detail-nisn').innerText = studentData.nisn;
            document.getElementById('detail-dob').innerText = studentData.dob;

            renderUploadUI('kk', studentData.kkUrl);
            renderUploadUI('akta', studentData.aktaUrl);
        }

        // PERUBAHAN: Fungsi showList dialihkan untuk memicu history.back() browser
        function showList() {
            history.back();
        }

        function renderListUI() {
            document.getElementById('view-detail').classList.add('hidden');
            document.getElementById('view-list').classList.remove('hidden');
            
            // Sembunyikan tombol back di header navbar kembali
            const btnNavBack = document.getElementById('btn-nav-back');
            btnNavBack.classList.add('hidden');
            btnNavBack.classList.remove('flex');

            currentStudent = null;
        }

        // ==========================================
        // UPLOAD LOGIC & UI
        // ==========================================
        function renderUploadUI(type, fileUrl) {
            const container = document.getElementById(`ui-${type}`);
            
            if (!fileUrl) {
                container.innerHTML = `
                    <svg class="w-10 h-10 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="text-sm text-slate-500 mb-4">Belum ada file terupload.</p>
                    <button onclick="document.getElementById('input-${type}').click()" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2 rounded-full text-sm font-medium transition shadow-sm">Pilih File</button>
                `;
                container.classList.add('border-dashed');
                container.classList.remove('border-solid', 'bg-slate-50');
            } else {
                container.innerHTML = `
                    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mb-3">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <p class="text-sm font-semibold text-emerald-700 mb-4">File Tersimpan di Drive</p>
                    <div class="flex space-x-2">
                        <button onclick="window.open('${fileUrl}', '_blank')" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-4 py-2 rounded-full text-sm font-medium transition">Lihat File</button>
                        <button onclick="document.getElementById('input-${type}').click()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-full text-sm font-medium transition">Upload Ulang</button>
                    </div>
                `;
                container.classList.remove('border-dashed');
                container.classList.add('border-solid', 'bg-slate-50', 'border-emerald-200');
            }
        }

        function handleFileSelect(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const container = document.getElementById(`ui-${type}`);
            container.innerHTML = `
                <div class="loader mb-3"></div>
                <p class="text-sm text-slate-500">Mengunggah ke server...</p>
            `;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result.split(',')[1];
                
                if (USE_MOCK) {
                    setTimeout(() => {
                        const fakeUrl = "https://drive.google.com/file/d/dummy/view";
                        if(type === 'kk') currentStudent.kkUrl = fakeUrl;
                        if(type === 'akta') currentStudent.aktaUrl = fakeUrl;
                        renderUploadUI(type, fakeUrl);
                        Swal.fire({icon: 'success', title: 'Berhasil', text: 'File tersimpan!', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000});
                    }, 2000);
                } else {
                    const payload = {
                        action: 'uploadFile',
                        id: currentStudent.id,
                        type: type,
                        fileName: file.name,
                        mimeType: file.type,
                        data: base64Data
                    };

                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res.success) {
                            renderUploadUI(type, res.fileUrl);
                            Swal.fire({icon: 'success', title: 'Berhasil', text: 'File tersimpan ke Drive!', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000});
                        } else {
                            renderUploadUI(type, null); 
                            Swal.fire('Error', res.message || 'Gagal mengunggah file.', 'error');
                        }
                    }).catch(err => {
                        renderUploadUI(type, null);
                        Swal.fire('Error', 'Terjadi kesalahan jaringan.', 'error');
                    });
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
